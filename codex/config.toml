# Copied to ~/.codex/config.toml by setup.sh only if missing; Codex owns it after that.

[features]
hooks = true
js_repl = false

[desktop]
appearanceTheme = "dark"
appearanceDarkCodeThemeId = "github"
followUpQueueMode = "queue"
conversationDetailMode = "STEPS_COMMANDS"
appearanceLightCodeThemeId = "one"
sansFontSize = 15
codeFontSize = 13
selected-avatar-id = "pet_6abc23873f048191b051292064d75acb"
show-context-window-usage = true

[desktop.appearanceDarkChromeTheme]
accent = "#1f6feb"
accentSource = "custom"
contrast = 59
ink = "#e6edf3"
opaqueWindows = true
surface = "#0d1117"

[desktop.appearanceDarkChromeTheme.fonts]
code = '"TX-02"'

[desktop.appearanceDarkChromeTheme.semanticColors]
diffAdded = "#3fb950"
diffRemoved = "#f85149"
skill = "#bc8cff"

[desktop.appearanceLightChromeTheme]
accent = "#526fff"
accentSource = "custom"
contrast = 100
ink = "#383a42"
opaqueWindows = false
surface = "#fafafa"

[desktop.appearanceLightChromeTheme.fonts]

[desktop.appearanceLightChromeTheme.semanticColors]
diffAdded = "#3bba54"
diffRemoved = "#e45649"
skill = "#526fff"
